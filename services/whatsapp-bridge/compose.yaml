services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    env_file: bridge.env
    volumes:
      - whatsapp-session:/data
    ports:
      - "127.0.0.1:3001:3001"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health',{headers:{authorization:'Bearer '+process.env.WHATSAPP_BRIDGE_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
volumes:
  whatsapp-session:
