name: Publish complete JJ-Media application

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-from-repair.yml

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified transfer branch
        uses: actions/checkout@v4
        with:
          ref: repair/jj-media-social-outbound
          fetch-depth: 0

      - name: Reconstruct verified archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jj-import
          mkdir -p /tmp/jj-import
          {
            cat .transfer/current/part00
            cat .transfer/current/part01
            cat .transfer/current/part02
            cat .transfer/current/part03
            cat .transfer/fix/part04-0 .transfer/fix/part04-1 .transfer/fix/part04-2 .transfer/fix/part04-3
            cat .transfer/fix/part05-0 .transfer/fix/part05-1 .transfer/fix/part05-2 .transfer/fix/part05-3
            cat .transfer/current/part06
            cat .transfer/fix/part07-0 .transfer/fix/part07-1 .transfer/fix/part07-2 .transfer/fix/part07-3
            cat .transfer/current/part08
          } > /tmp/jj-import/source.b64
          base64 --decode /tmp/jj-import/source.b64 > /tmp/jj-import/source.tar.xz
          echo "94752c816ef8ea31560edfdcb8cc1026b840281788a03e1521548e6cd6fb8e94  /tmp/jj-import/source.tar.xz" | sha256sum --check --strict
          xz --test /tmp/jj-import/source.tar.xz
          tar -xJf /tmp/jj-import/source.tar.xz -C /tmp/jj-import
          test -f /tmp/jj-import/Website-Master-main/package.json
          test -f /tmp/jj-import/Website-Master-main/app/dashboard/page.tsx

      - name: Prepare deployable application
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/jj-import/Website-Master-main/. .
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.engines = { ...(pkg.engines || {}), node: '>=22.17.0' };
          pkg.scripts = { ...(pkg.scripts || {}), 'vercel-build': 'next build' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'CI'
          name: CI
          on:
            push:
              branches: [main]
            pull_request:
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.17.0
                    cache: npm
                - run: npm ci
                - run: npm run typecheck
                - run: npm run build
          CI
          test -f package.json
          test -f package-lock.json
          test -f app/dashboard/page.tsx
          test ! -d .transfer

      - name: Force-publish complete source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete JJ-Media social outbound system"
          git push --force origin HEAD:main
