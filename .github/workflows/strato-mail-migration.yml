name: Apply STRATO mail migration

on:
  push:
    branches: [work/strato-mail-20260905]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/strato-mail-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply provider migration
        run: node scripts/apply-strato-mail-migration.mjs
      - name: Commit generated provider changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply STRATO mail provider migration"
          git push origin HEAD:work/strato-mail-20260905
