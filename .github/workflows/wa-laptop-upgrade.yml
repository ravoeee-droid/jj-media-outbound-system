name: WhatsApp laptop upgrade

on:
  push:
    paths:
      - '.wa-laptop-upgrade-trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Apply laptop bridge upgrade
        run: python3 scripts/apply-wa-laptop-upgrade.py
      - name: Validate root application
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm run test:whatsapp
      - name: Validate laptop worker
        working-directory: services/whatsapp-bridge
        run: |
          npm install --ignore-scripts
          npm test
          node --check server.mjs
      - name: Commit upgrade
        run: |
          rm -f .wa-laptop-upgrade-trigger scripts/apply-wa-laptop-upgrade.py .github/workflows/wa-laptop-upgrade.yml
          git config user.name "jj-media-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: run WhatsApp sync from local laptop"
          git push origin HEAD:main
