name: Baileys laptop upgrade

on:
  push:
    paths:
      - '.baileys-laptop-trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply Baileys laptop upgrade
        run: python3 scripts/apply-baileys-laptop.py
      - name: Validate outbound tool
        run: |
          npm ci
          npm run typecheck
          npm run test:whatsapp
      - name: Validate Windows WhatsApp worker
        working-directory: services/whatsapp-bridge
        run: |
          npm install --ignore-scripts
          npm test
      - name: Commit verified upgrade
        run: |
          rm -f .baileys-laptop-trigger scripts/apply-baileys-laptop.py .github/workflows/baileys-laptop.yml
          git config user.name "jj-media-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: run WhatsApp from Windows laptop with Baileys"
          git push origin HEAD:main
